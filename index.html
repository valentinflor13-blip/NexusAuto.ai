    <script>
      // Ignore HMR WebSocket connection errors in sandbox iframe environment
      window.addEventListener('unhandledrejection', function (event) {
        if (event.reason && (String(event.reason).includes('WebSocket') || String(event.reason).includes('createWebSocketModuleRunnerTransport'))) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function (event) {
        if (event.message && (String(event.message).includes('WebSocket') || String(event.message).includes('createWebSocketModuleRunnerTransport'))) {
          event.preventDefault();
        }
      }, true);
    </script>
